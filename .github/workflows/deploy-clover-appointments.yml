name: Deploy Clover appointments sync to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'clover-appointments/src/cloud_run/**'
  workflow_dispatch:

# Keyless Google Cloud auth (Workload Identity Federation). See docs/credentials.md.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/304363458561/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: claude-sessions@shp-ai-bot-2026.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Credentials come from Secret Manager at runtime; nothing sensitive is
      # passed through this workflow. The service is private: only the
      # scheduler's OIDC identity (granted run.invoker by setup) can call it.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy clover-appointments \
            --source ./clover-appointments/src/cloud_run \
            --region us-central1 \
            --project shp-ai-bot-2026 \
            --no-allow-unauthenticated \
            --set-secrets "EMAIL_USER=EMAIL_USER:latest,GOOGLE_APP_PASSWORD=GOOGLE_APP_PASSWORD:latest,TEAMDESK_TOKEN=TEAMDESK_TOKEN:latest" \
            --quiet

      # The webhook: same code, second service. Public because Postmark can't
      # send a Google identity token; /inbound requires Postmark's basic-auth
      # credentials (POSTMARK_INBOUND_AUTH) and INBOUND_ONLY disables /poll.
      # It gets no mailbox credentials.
      - name: Deploy the Postmark webhook service
        run: |
          gcloud run deploy clover-inbound \
            --source ./clover-appointments/src/cloud_run \
            --region us-central1 \
            --project shp-ai-bot-2026 \
            --allow-unauthenticated \
            --set-env-vars "INBOUND_ONLY=1" \
            --set-secrets "TEAMDESK_TOKEN=TEAMDESK_TOKEN:latest,INBOUND_AUTH=POSTMARK_INBOUND_AUTH:latest" \
            --quiet
