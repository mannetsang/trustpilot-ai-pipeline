name: Deploy Google Business Profile reviews service

# Deploys google-business/cloud_run to the Cloud Run service `gbp-reviews` and
# keeps its Cloud Scheduler job (every 30 minutes -> /monitor) in place. The
# Trustpilot twin of this service is deployed by deploy.yml.
#
# Credentials reach the container as Secret Manager references, never as
# values in this file: the three Business Profile OAuth values, the Chat
# webhook and the API token (see google-business/README.md).

on:
  push:
    branches: [main]
    paths:
      - 'google-business/cloud_run/**'
      - '.github/workflows/deploy-gbp-reviews.yml'
  workflow_dispatch:

# Keyless Google Cloud auth (Workload Identity Federation): the job asks GitHub
# for an OIDC token and Google swaps it for claude-sessions' credentials. No
# JSON key is stored. See docs/credentials.md.
permissions:
  contents: read
  id-token: write

env:
  PROJECT: shp-ai-bot-2026
  REGION: us-central1
  SERVICE: gbp-reviews
  GOOGLE_SHEET_ID: 1I6RJ9SoESONvCRnRZWMCwLq6wU3utYukWqC3w7iUav4
  GBP_ACCOUNT: accounts/111445610944292236883

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/304363458561/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: claude-sessions@shp-ai-bot-2026.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source ./google-business/cloud_run \
            --region "$REGION" --project "$PROJECT" \
            --allow-unauthenticated \
            --min-instances 0 --max-instances 3 --timeout 900 \
            --set-env-vars "GOOGLE_SHEET_ID=$GOOGLE_SHEET_ID,GBP_ACCOUNT=$GBP_ACCOUNT" \
            --set-secrets "GOOGLE_BUSINESS_PROFILE_CLIENT_ID=google-business-profile-client-id:latest,GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET=google-business-profile-client-secret:latest,GOOGLE_BUSINESS_PROFILE_REFRESH_TOKEN=google-business-profile-refresh-token:latest,GCHAT_WEBHOOK_URL=gbp-reviews-gchat-webhook-url:latest,API_TOKEN=gbp-reviews-api-token:latest" \
            --quiet

      - name: Upsert the 30-minute monitor job
        # claude-sessions has no Cloud Scheduler role, so this step only warns
        # when it can't; the job was created once by an owner on 2026-10-01
        # (see google-business/README.md) and does not need to change on
        # redeploys because the service URL is stable.
        continue-on-error: true
        run: |
          SERVICE_URL=$(gcloud run services describe "$SERVICE"             --region "$REGION" --project "$PROJECT" --format 'value(status.url)')
          gcloud scheduler jobs update http gbp-reviews-monitor             --location "$REGION" --project "$PROJECT"             --schedule "*/30 * * * *" --time-zone "Etc/UTC"             --uri "$SERVICE_URL/monitor" --http-method GET --attempt-deadline 900s --quiet           || gcloud scheduler jobs create http gbp-reviews-monitor             --location "$REGION" --project "$PROJECT"             --schedule "*/30 * * * *" --time-zone "Etc/UTC"             --uri "$SERVICE_URL/monitor" --http-method GET --attempt-deadline 900s --quiet           || echo "::warning::Could not upsert the scheduler job (claude-sessions lacks roles/cloudscheduler.admin); create it once as an owner, see google-business/README.md"
