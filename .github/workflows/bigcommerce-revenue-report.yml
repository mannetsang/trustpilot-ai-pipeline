name: BigCommerce revenue by payment method

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Calendar year to report on (UTC)'
        required: false
        default: '2026'
      by_channel:
        description: 'Break the table down by channel_id'
        type: boolean
        required: false
        default: false

# Keyless Google Cloud auth (Workload Identity Federation): the job asks GitHub
# for an OIDC token and Google swaps it for claude-sessions' credentials. No
# JSON key is stored — GCP_SA_KEY is retired. See docs/credentials.md.
permissions:
  contents: read
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Credentials come from Secret Manager, reached through federation, so
      # no secret is needed at all — the BigCommerce token never touches GitHub.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/304363458561/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: claude-sessions@shp-ai-bot-2026.iam.gserviceaccount.com

      - name: Install dependencies
        run: pip install --quiet google-cloud-secret-manager

      - name: Run the report
        env:
          GCP_PROJECT: shp-ai-bot-2026
          # The store hash identifies the store in the URL path and isn't
          # sensitive, so it stays inline rather than occupying a secret.
          BC_STORE_HASH: gmosz3ja
          BC_ACCESS_TOKEN_SECRET: BIGCOMMERCE_gmosz3ja_ACCESS_TOKEN
        run: |
          python3 bigcommerce-reports/revenue_by_payment_method.py \
            --year "${{ inputs.year }}" \
            ${{ inputs.by_channel && '--by-channel' || '' }} \
            --csv "revenue-by-payment-method-${{ inputs.year }}.csv" \
            | tee report.txt
          {
            echo '## Revenue by payment method — ${{ inputs.year }}'
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: revenue-by-payment-method-${{ inputs.year }}
          path: revenue-by-payment-method-${{ inputs.year }}.csv
          if-no-files-found: error
