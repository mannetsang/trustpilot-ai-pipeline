name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'trustpilot-pipeline/src/cloud_run/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy trustpilot-webhook \
            --source ./trustpilot-pipeline/src/cloud_run \
            --region us-central1 \
            --project shp-ai-bot-2026 \
            --min-instances 1 \
            --quiet
