name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'trustpilot-pipeline/src/cloud_run/**'
  workflow_dispatch:

# Keyless Google Cloud auth (Workload Identity Federation): the job asks GitHub
# for an OIDC token and Google swaps it for claude-sessions' credentials. No
# JSON key is stored — GCP_SA_KEY is retired. See docs/credentials.md.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/304363458561/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: claude-sessions@shp-ai-bot-2026.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy trustpilot-webhook \
            --source ./trustpilot-pipeline/src/cloud_run \
            --region us-central1 \
            --project shp-ai-bot-2026 \
            --min-instances 1 \
            --quiet
