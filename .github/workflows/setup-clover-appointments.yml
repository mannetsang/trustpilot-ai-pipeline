name: Setup Clover appointments sync

# Re-runnable setup for the Clover email -> TeamDesk sync, after the deploy:
# grants the runtime service account run.invoker on the (private) service and
# creates/updates a Cloud Scheduler job that calls /poll with an OIDC token.
# The runtime account already reads the secrets the deploy mounts.
#
# Needs Cloud Scheduler admin on claude-sessions (cloudscheduler.jobs.*); without
# it, create the job once by hand with the command in clover-appointments/README.md.

on:
  workflow_dispatch:
    inputs:
      schedule:
        description: 'Cron schedule (America/Toronto)'
        required: true
        default: '*/5 * * * *'

# Keyless Google Cloud auth (Workload Identity Federation). See docs/credentials.md.
permissions:
  contents: read
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/304363458561/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: claude-sessions@shp-ai-bot-2026.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve the runtime service account
        run: |
          NUMBER=$(gcloud projects describe shp-ai-bot-2026 --format 'value(projectNumber)')
          echo "SA=$NUMBER-compute@developer.gserviceaccount.com" >> "$GITHUB_ENV"

      - name: Create the scheduler job (OIDC-authenticated)
        run: |
          if ! gcloud run services describe clover-appointments \
               --region us-central1 --project shp-ai-bot-2026 >/dev/null 2>&1; then
            echo "Service not deployed yet: run 'Deploy Clover appointments sync', then re-run this."
            exit 0
          fi
          gcloud run services add-iam-policy-binding clover-appointments \
            --region us-central1 --project shp-ai-bot-2026 \
            --member "serviceAccount:$SA" --role roles/run.invoker --quiet >/dev/null
          URL=$(gcloud run services describe clover-appointments \
            --region us-central1 --project shp-ai-bot-2026 --format 'value(status.url)')
          ARGS=(--location us-central1 --project shp-ai-bot-2026
                --schedule "${{ inputs.schedule }}" --time-zone "America/Toronto"
                --uri "$URL/poll" --http-method GET --attempt-deadline 180s
                --oidc-service-account-email "$SA" --oidc-token-audience "$URL" --quiet)
          gcloud scheduler jobs update http clover-appointments-poll "${ARGS[@]}" \
            || gcloud scheduler jobs create http clover-appointments-poll "${ARGS[@]}"
