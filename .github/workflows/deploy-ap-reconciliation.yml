name: Deploy AP credit-card reconciliation service

# Deploys ap-reconciliation/cloud_run to the Cloud Run service
# `ap-reconciliation` (statement upload, invoice matching, Chat reminders and
# the reconciliation dashboard; see ap-reconciliation/README.md), the public
# sign-in page ap-reconciliation/login as the service
# `ap-reconciliation-login`, and, from the dashboard's image, the Cloud Run
# job `ap-reconciliation-remind` that Cloud Scheduler runs every Monday.
#
# Credentials reach the containers as Secret Manager references, never as
# values in this file: the Supabase service-role key, the AP user's Drive
# OAuth triple and the per-card Chat webhooks.
#
# Access: Google sign-in through Identity-Aware Proxy (IAP), decided
# 2026-10-13. The service has no public invoker (--no-allow-unauthenticated
# --iap): Google signs people in before any request reaches the container,
# only the superhairpieces.com domain is on IAP's access list (README step
# 5), and the app verifies IAP's signed header against IAP_AUDIENCE. The
# other two modes stay one edit away: AUTH_DISABLED=1 with
# --allow-unauthenticated --no-iap opens the dashboard to anyone with the
# URL, and adding DASHBOARD_PASSWORD=ap-reconciliation-dashboard-password:latest
# to SECRETS puts a shared password in front of that (README, "Access").
#
# The Supabase project URL is set inline below: a public identifier, not a
# secret.

on:
  push:
    branches: [main]
    paths:
      - 'ap-reconciliation/cloud_run/**'
      - 'ap-reconciliation/login/**'
      - '.github/workflows/deploy-ap-reconciliation.yml'
  workflow_dispatch:

# Keyless Google Cloud auth (Workload Identity Federation): the job asks GitHub
# for an OIDC token and Google swaps it for claude-sessions' credentials. No
# JSON key is stored. See docs/credentials.md.
permissions:
  contents: read
  id-token: write

env:
  PROJECT: shp-ai-bot-2026
  REGION: us-central1
  SERVICE: ap-reconciliation
  LOGIN_SERVICE: ap-reconciliation-login
  JOB: ap-reconciliation-remind
  INVOICE_FOLDER_ID: 18YkGTNDIrxdQgHRgquvQizI8fLsFOpPk
  SUPABASE_URL: https://bkkifrwfgtcnmfynbbdd.supabase.co
  ALLOWED_DOMAINS: superhairpieces.com
  AP_EMAILS: ap@superhairpieces.com,manne@superhairpieces.com
  # What the IAP assertion's audience must be: this service, by project number.
  IAP_AUDIENCE: /projects/304363458561/locations/us-central1/services/ap-reconciliation
  SECRETS: SUPABASE_SERVICE_KEY=ap-reconciliation-supabase-service-key:latest,GOOGLE_WORKSPACE_AP_CLIENT_ID=google-workspace-ap-client-id:latest,GOOGLE_WORKSPACE_AP_CLIENT_SECRET=google-workspace-ap-client-secret:latest,GOOGLE_WORKSPACE_AP_REFRESH_TOKEN=google-workspace-ap-refresh-token:latest,CARD_WEBHOOKS_JSON=ap-reconciliation-card-webhooks:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/304363458561/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: claude-sessions@shp-ai-bot-2026.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Behind IAP: no public invoker, Google signs people in first, the app
      # checks the assertion against IAP_AUDIENCE and applies ALLOWED_DOMAINS
      # and AP_EMAILS on top. One instance, because jobs serialize
      # on an in-process lock. CPU stays allocated between requests because
      # the dashboard's long steps (invoice reads, matching) run as
      # background jobs that the page polls; throttled, they would stall.
      # 30 minutes because a synchronous upload reads every new invoice
      # before it answers. The "^;^" prefix makes gcloud split the env-var
      # list on semicolons instead of commas, because AP_EMAILS holds a
      # comma-separated list itself.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source ./ap-reconciliation/cloud_run \
            --region "$REGION" --project "$PROJECT" \
            --no-allow-unauthenticated --iap --no-cpu-throttling \
            --min-instances 0 --max-instances 1 --timeout 1800 --memory 1Gi \
            --set-env-vars "^;^INVOICE_FOLDER_ID=$INVOICE_FOLDER_ID;ALLOWED_DOMAINS=$ALLOWED_DOMAINS;AP_EMAILS=$AP_EMAILS;SUPABASE_URL=$SUPABASE_URL;IAP_AUDIENCE=$IAP_AUDIENCE" \
            --set-secrets "$SECRETS" \
            --quiet

      # The sign-in page: one public static page (nginx) with "Continue with
      # Google", where the dashboard's "Sign out" lands. It cannot live on the
      # dashboard service, which IAP guards on every path. It bakes the
      # dashboard's URL in at container start, so it deploys after the
      # dashboard; the dashboard learns its URL in the next step.
      - name: Deploy the sign-in page
        run: |
          SERVICE_URL=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --project "$PROJECT" --format 'value(status.url)')
          gcloud run deploy "$LOGIN_SERVICE" \
            --source ./ap-reconciliation/login \
            --region "$REGION" --project "$PROJECT" \
            --allow-unauthenticated --no-iap \
            --port 8080 --cpu 1 --memory 256Mi \
            --min-instances 0 --max-instances 2 \
            --set-env-vars "DASHBOARD_URL=$SERVICE_URL" \
            --quiet

      # The Chat cards carry "Open dashboard" buttons, which need the absolute
      # URL of the service; a request-less run (the weekly job) has nothing to
      # derive it from. "Sign out" needs the sign-in page's URL the same way.
      # Both are only known after a deploy, and --set-env-vars above replaces
      # the whole set on every deploy, so this step runs each time.
      - name: Point DASHBOARD_URL and LOGIN_URL at the services
        run: |
          SERVICE_URL=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --project "$PROJECT" --format 'value(status.url)')
          LOGIN_URL=$(gcloud run services describe "$LOGIN_SERVICE" \
            --region "$REGION" --project "$PROJECT" --format 'value(status.url)')
          echo "Service URL: $SERVICE_URL"
          echo "Sign-in page: $LOGIN_URL"
          gcloud run services update "$SERVICE" \
            --region "$REGION" --project "$PROJECT" \
            --update-env-vars "DASHBOARD_URL=$SERVICE_URL,LOGIN_URL=$LOGIN_URL" \
            --quiet

      # Weekly reminder: a Cloud Run job running `python main.py remind` in the
      # image the service was just built from, with the same secrets. Cloud
      # Scheduler starts it on Mondays through the Cloud Run API with its own
      # service account (no token, no path through IAP); that scheduler job is
      # created once by an owner (README, "One-time setup"). Only warns when
      # claude-sessions may not manage jobs.
      - name: Deploy the weekly reminder job
        continue-on-error: true
        run: |
          IMAGE=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --project "$PROJECT" --format 'value(spec.template.spec.containers[0].image)')
          SERVICE_URL=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --project "$PROJECT" --format 'value(status.url)')
          echo "Job image: $IMAGE"
          gcloud run jobs deploy "$JOB" \
            --image "$IMAGE" \
            --region "$REGION" --project "$PROJECT" \
            --command python --args main.py,remind \
            --tasks 1 --max-retries 0 --task-timeout 1800 --memory 1Gi \
            --set-env-vars "^;^INVOICE_FOLDER_ID=$INVOICE_FOLDER_ID;ALLOWED_DOMAINS=$ALLOWED_DOMAINS;AP_EMAILS=$AP_EMAILS;SUPABASE_URL=$SUPABASE_URL;DASHBOARD_URL=$SERVICE_URL" \
            --set-secrets "$SECRETS" \
            --quiet \
          || echo "::warning::Could not deploy the Cloud Run job $JOB (claude-sessions needs roles/run.admin on jobs); the weekly reminder will not run until it is deployed, see ap-reconciliation/README.md"
