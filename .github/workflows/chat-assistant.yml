name: Deploy chat assistant to Cloud Run

# Builds and deploys chat-assistant. Runs on push to main when the service changes, or by hand.
#
# Prerequisite, once: a project Owner runs chat-assistant/setup.sh in Cloud Shell. It creates
# what this workflow's identity may not: the app's service account and grants, the secrets'
# access policies, and the hourly Cloud Scheduler job. See chat-assistant/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'chat-assistant/src/cloud_run/**'
      - '.github/workflows/chat-assistant.yml'
  workflow_dispatch:

# Keyless Google Cloud auth (Workload Identity Federation), as in the other workflows.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/304363458561/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: claude-sessions@shp-ai-bot-2026.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy chat-assistant \
            --source ./chat-assistant/src/cloud_run \
            --region us-central1 \
            --project shp-ai-bot-2026 \
            --service-account chat-assistant@shp-ai-bot-2026.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --timeout 3600 --memory 1Gi --max-instances 3 \
            --set-env-vars "OWNER_EMAIL=manne@superhairpieces.com,GCP_PROJECT=shp-ai-bot-2026" \
            --quiet
          URL=$(gcloud run services describe chat-assistant --region us-central1 --project shp-ai-bot-2026 --format 'value(status.url)')
          echo "### Chat assistant deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
